<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Play &amp; Learn: Rock, Paper, Scissors in Python</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#16202e;--mute:#566679;--line:#d5dde7;--teal:#0f6b7a;--hl:#ffd23f;--win:#1b8a5a;--lose:#d6452b;--draw:#6b7a8f;--code:#14202e;--codeink:#d8e2ee;--kw:#ff9e64;--str:#9ece6a;--cm:#6f8199;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1621;--card:#172334;--ink:#e8eef5;--mute:#9bacbf;--line:#2a3a50;--teal:#4cc3d6;--code:#0a121b}}
:root[data-theme="dark"]{--bg:#0e1621;--card:#172334;--ink:#e8eef5;--mute:#9bacbf;--line:#2a3a50;--teal:#4cc3d6;--code:#0a121b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.5 Nunito,system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:clamp(1.6rem,4vw,2.3rem);margin:0 0 4px;font-weight:800}
.sub{color:var(--mute);margin:0 0 20px}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px}
.panel h2{margin:0 0 12px;font-size:1.1rem;font-weight:800}
.score{display:flex;gap:12px;margin-bottom:16px}
.score div{flex:1;text-align:center;border-radius:12px;padding:8px;background:var(--bg)}
.score b{display:block;font-size:1.8rem;line-height:1.1}
.score span{color:var(--mute);font-size:.85rem}
.arena{display:flex;align-items:center;justify-content:space-around;min-height:110px;font-size:3.6rem;margin:6px 0 4px}
.arena small{display:block;font-size:.8rem;color:var(--mute);text-align:center}
.vs{font-size:1rem;color:var(--mute)}
.banner{text-align:center;font-weight:800;font-size:1.4rem;min-height:2em;margin-bottom:12px}
.win{color:var(--win)}.lose{color:var(--lose)}.draw{color:var(--draw)}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pick{font:inherit;font-weight:800;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 6px;cursor:pointer;font-size:2rem}
.pick span{display:block;font-size:.85rem;color:var(--mute)}
.pick:hover:not(:disabled){border-color:var(--teal)}
.pick:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,.tab:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.btn{font:inherit;font-weight:800;border:0;border-radius:10px;padding:9px 16px;background:var(--teal);color:#fff;cursor:pointer}
:root[data-theme="dark"] .btn{color:#06222a}
.btn.alt{background:var(--bg);color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.narr{margin-top:14px;border-left:5px solid var(--hl);background:var(--bg);border-radius:10px;padding:10px 14px;min-height:5.4em}
.narr small{color:var(--mute)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tab{font:600 .85rem "JetBrains Mono",monospace;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
:root[data-theme="dark"] .tab[aria-selected="true"]{color:#06222a}
.note{color:var(--mute);margin:0 0 10px;font-size:.95rem}
.code{background:var(--code);color:var(--codeink);border-radius:12px;padding:10px 0;font:400 13px/1.65 "JetBrains Mono",monospace;overflow-x:auto;max-height:520px;overflow-y:auto}
.ln{display:flex;white-space:pre;padding:0 12px 0 0;border-left:4px solid transparent}
.ln i{font-style:normal;color:var(--cm);width:2.6em;text-align:right;padding-right:12px;flex:none;user-select:none}
.ln.on{background:rgba(255,210,63,.2);border-left-color:var(--hl)}
.k{color:var(--kw)}.s{color:var(--str)}.c{color:var(--cm)}
.hist{margin:12px 0 0;padding:0;list-style:none;font-size:.9rem;color:var(--mute)}
@media(prefers-reduced-motion:no-preference){.ln{transition:background .2s}}
</style>
</head>
<body>
<main>
<h1>Play &amp; Learn: Rock, Paper, Scissors</h1>
<p class="sub">Pick a move. Then watch which lines of your Python program run to play the round.</p>
<div class="grid">
  <section class="panel" aria-label="Game">
    <h2>The game</h2>
    <div class="score">
      <div><b id="ps">0</b><span>player_score</span></div>
      <div><b id="cs">0</b><span>computer_score</span></div>
    </div>
    <div class="arena" aria-live="polite">
      <div><span id="uE">❔</span><small>You</small></div>
      <div class="vs">vs</div>
      <div><span id="cE">❔</span><small>Computer</small></div>
    </div>
    <div class="banner" id="banner" aria-live="polite">Choose your move</div>
    <div class="picks" id="picks">
      <button class="pick" data-m="rock">✊<span>rock</span></button>
      <button class="pick" data-m="paper">👋<span>paper</span></button>
      <button class="pick" data-m="scissors">✌️<span>scissors</span></button>
    </div>
    <div class="ctl">
      <label><input type="checkbox" id="manual"> Step through slowly</label>
      <button class="btn" id="next" disabled>Next step</button>
      <button class="btn alt" id="reset">Reset score</button>
    </div>
    <div class="narr" id="narr"><small>What’s happening</small><div id="narrT">Click a move. Each step below tells you what the code is doing.</div></div>
    <ul class="hist" id="hist"></ul>
  </section>

  <section class="panel" aria-label="Python code">
    <h2>The Python code</h2>
    <div class="tabs" role="tablist" id="tabs"></div>
    <p class="note" id="fnote"></p>
    <div class="code" id="code" role="region" aria-label="Source code" tabindex="0"></div>
  </section>
</div>
</main>
<script>
var FILES = {
"main.py": `from game_logic import determine_winner
from player import get_user_input
from computer import get_computer_choice

EMOJI_MAP = {
    "rock": "✊",
    "paper": "👋",
    "scissors": "✌️",
}

player_score = 0
computer_score = 0

def get_emoji(choice):
    return EMOJI_MAP.get(choice)

def welcome_user():
    print("Welcome to Rock, Paper, Scissors!")

welcome_user()

valid_choices = ["rock", "paper", "scissors"]

play_again = "yes"

while play_again == "yes":

    user_choice = get_user_input(valid_choices)

    print(f"You chose: {get_emoji(user_choice)}")

    computer_choice = get_computer_choice(valid_choices)

    print(f"Computer chose: {get_emoji(computer_choice)}")

    result = determine_winner(user_choice, computer_choice)

    print(result)

    if result == "You win!":
        player_score += 1
    elif result == "You lose!":
        computer_score += 1

    play_again = input("Do you want to play again? (yes/no): ")

print(f"Your score: {player_score}")
print(f"Computer score: {computer_score}")

print("Thank you for playing")`,
"game_logic.py": `def determine_winner(user_choice, computer_choice):

    if user_choice == computer_choice:
        result = "Draw!"
    elif user_choice == "rock" and computer_choice == "scissors":
        result = "You win!"
    elif user_choice == "scissors" and computer_choice == "paper":
        result = "You win!"
    elif user_choice == "paper" and computer_choice == "rock":
        result = "You win!"
    else:
        result = "You lose!"

    return(result)`,
"player.py": `def get_user_input(valid_choices):

    while True:

        user_choice = input("Enter rock, paper, or scissors: ").lower()

        if user_choice in valid_choices:
            break

        print("Oops! That's not a valid move. Please enter rock, paper, or scissors.")

    return user_choice`,
"computer.py": `import random

def get_computer_choice(valid_choices):
    computer_choice = random.choice(valid_choices)
    return computer_choice`
};
var NOTES = {
"main.py": "The control centre: imports, variables, a while loop, and f-strings.",
"game_logic.py": "A function that uses if / elif / else to decide who wins.",
"player.py": "A function with a while loop that keeps asking until the move is valid.",
"computer.py": "Importing the random module and picking from a list."
};
var EMO = {rock:"✊",paper:"👋",scissors:"✌️"};
var MOVES = ["rock","paper","scissors"];
var cur = "main.py", ps = 0, cs = 0, busy = false, timer = null, queue = [], qi = 0;
var $ = function(id){return document.getElementById(id)};

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function paint(s){
  return esc(s).replace(/(#.*$)|(f?"[^"]*")|\b(from|import|def|while|if|elif|else|return|break|True|and|in)\b/g,
    function(m,c,str,kw){return c?'<span class="c">'+m+'</span>':str?'<span class="s">'+m+'</span>':'<span class="k">'+m+'</span>'});
}
function showFile(name, hlIdx){
  cur = name;
  var tabs = document.querySelectorAll(".tab");
  for (var i=0;i<tabs.length;i++) tabs[i].setAttribute("aria-selected", tabs[i].dataset.f===name);
  $("fnote").textContent = NOTES[name];
  var lines = FILES[name].split("\n"), h = "";
  for (var j=0;j<lines.length;j++){
    h += '<div class="ln'+(j===hlIdx?' on':'')+'" data-i="'+j+'"><i>'+(j+1)+'</i><span>'+paint(lines[j])+'</span></div>';
  }
  $("code").innerHTML = h;
  var on = $("code").querySelector(".on");
  if (on) on.scrollIntoView({block:"nearest"});
}
function find(file, text, exact){
  var L = FILES[file].split("\n");
  for (var i=0;i<L.length;i++){
    var t = L[i].trim();
    if (exact ? t===text : t.indexOf(text)>-1) return i;
  }
  return -1;
}
(function init(){
  var h = "";
  Object.keys(FILES).forEach(function(f){h += '<button class="tab" role="tab" data-f="'+f+'">'+f+'</button>'});
  $("tabs").innerHTML = h;
  $("tabs").addEventListener("click", function(e){
    var f = e.target.dataset && e.target.dataset.f;
    if (f) showFile(f, -1);
  });
  showFile("main.py", -1);
})();

function buildSteps(u, c, r){
  var win = r==="You win!", draw = r==="Draw!";
  var logicLine = draw ? ["if user_choice == computer_choice:", false]
    : win ? ['elif user_choice == "'+u+'" and computer_choice == "'+c+'":', true]
    : ["else:", true];
  var logicWhy = draw ? "Both chose “"+u+"”, so the first if is True and result becomes “Draw!”."
    : win ? "This elif is the one that’s True: “"+u+"” beats “"+c+"”, so result becomes “You win!”."
    : "None of the if / elif checks matched, so Python falls through to else: result becomes “You lose!”.";
  var scoreLine = win ? ["player_score += 1", false] : draw ? ['play_again = input(', false] : ["computer_score += 1", false];
  var scoreWhy = win ? "result == “You win!” is True, so player_score goes up by 1 (+= means “add to itself”)."
    : draw ? "A draw matches neither the if nor the elif, so no score changes. The loop asks if you want to play again."
    : "The elif matches “You lose!”, so computer_score goes up by 1.";
  return [
    {f:"main.py", l:find("main.py","user_choice = get_user_input(valid_choices)"),
     t:"main.py calls the function get_user_input() and passes in the list valid_choices. In this web version, your click plays the part of input().", d:function(){$("uE").textContent=EMO[u];$("cE").textContent="❔";$("banner").textContent="…";$("banner").className="banner"}},
    {f:"player.py", l:find("player.py","if user_choice in valid_choices:"),
     t:"The in operator asks: is “"+u+"” inside the list? Yes, so we reach break and leave the while True loop."},
    {f:"player.py", l:find("player.py","return user_choice",true),
     t:"return sends “"+u+"” back to the line in main.py that called the function."},
    {f:"computer.py", l:find("computer.py","random.choice(valid_choices)"),
     t:"random.choice() picks one item from the list at random. This time it picked “"+c+"”.", d:function(){$("cE").textContent=EMO[c]}},
    {f:"main.py", l:find("main.py","result = determine_winner(user_choice, computer_choice)"),
     t:"main.py sends both moves to determine_winner() and stores what comes back in the variable result."},
    {f:"game_logic.py", l:find("game_logic.py", logicLine[0], logicLine[1]), t:logicWhy,
     d:function(){var b=$("banner");b.textContent=r;b.className="banner "+(win?"win":draw?"draw":"lose")}},
    {f:"main.py", l:find("main.py", scoreLine[0]), t:scoreWhy,
     d:function(){if(win)ps++;else if(!draw)cs++;$("ps").textContent=ps;$("cs").textContent=cs}}
  ];
}
function decide(u,c){
  if (u===c) return "Draw!";
  if ((u==="rock"&&c==="scissors")||(u==="scissors"&&c==="paper")||(u==="paper"&&c==="rock")) return "You win!";
  return "You lose!";
}
function setBusy(b){
  busy = b;
  var p = document.querySelectorAll(".pick");
  for (var i=0;i<p.length;i++) p[i].disabled = b;
  $("next").disabled = !(b && $("manual").checked);
}
function runStep(){
  var s = queue[qi];
  showFile(s.f, s.l);
  if (s.d) s.d();
  $("narrT").innerHTML = "<b>Step "+(qi+1)+" of "+queue.length+" · "+s.f+", line "+(s.l+1)+"</b><br>"+s.t;
  qi++;
  if (qi>=queue.length){ finish(); return; }
  if (!$("manual").checked) timer = setTimeout(runStep, 1900);
}
function finish(){
  var li = document.createElement("li");
  li.textContent = "Round "+($("hist").children.length+1)+": "+queue.hist;
  $("hist").insertBefore(li, $("hist").firstChild);
  setBusy(false);
  $("next").disabled = true;
}
function play(u){
  if (busy) return;
  clearTimeout(timer);
  var c = MOVES[Math.floor(Math.random()*3)], r = decide(u,c);
  queue = buildSteps(u,c,r); qi = 0;
  queue.hist = EMO[u]+" vs "+EMO[c]+" → "+r;
  setBusy(true);
  runStep();
}
$("picks").addEventListener("click", function(e){
  var b = e.target.closest(".pick"); if (b) play(b.dataset.m);
});
$("next").addEventListener("click", function(){ if (busy && qi<queue.length) runStep(); });
$("manual").addEventListener("change", function(){
  if (!busy) return;
  clearTimeout(timer);
  $("next").disabled = !this.checked;
  if (!this.checked && qi<queue.length) timer = setTimeout(runStep, 600);
});
$("reset").addEventListener("click", function(){
  clearTimeout(timer); ps = cs = 0; qi = 0; queue = [];
  $("ps").textContent = 0; $("cs").textContent = 0;
  $("uE").textContent = "❔"; $("cE").textContent = "❔";
  $("banner").textContent = "Choose your move"; $("banner").className = "banner";
  $("hist").innerHTML = "";
  $("narrT").textContent = "Click a move. Each step below tells you what the code is doing.";
  setBusy(false); $("next").disabled = true; showFile("main.py", -1);
});
</script>
</body>
</html>
